const loadPersistedState = () => {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return null;
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (err) {
    console.warn('No se pudo leer el estado guardado en localStorage:', err);
    return null;
  }
};

// Convierte una fecha ISO en un texto relativo corto en español (ej. "hace 3 min").
const formatRelativeTime = (isoString) => {
  try {
    const diffMs = Date.now() - new Date(isoString).getTime();
    const diffSec = Math.round(diffMs / 1000);
    if (diffSec < 10) return 'hace un instante';
    if (diffSec < 60) return `hace ${diffSec} seg`;
    const diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return `hace ${diffMin} min`;
    const diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return `hace ${diffHr} h`;
    const diffDay = Math.round(diffHr / 24);
    return `hace ${diffDay} día${diffDay === 1 ? '' : 's'}`;
  } catch (err) {
    return '';
  }
};

  const [editProgramDraft, setEditProgramDraft] = useState({ code: '', label: '', color: 'emerald' });

  const handleStartEditProgramType = (program) => {
    setEditingProgramCode(program.code);
    setEditProgramDraft({ code: program.code, label: program.label, color: program.color || 'emerald' });
  };

  const handleCancelEditProgramType = () => {
    setEditingProgramCode(null);
    setEditProgramDraft({ code: '', label: '', color: 'emerald' });
  };

  const handleSaveEditProgramType = (e) => {
    e.preventDefault();
    const originalCode = editingProgramCode;
    const newCode = editProgramDraft.code.trim().toUpperCase();
    const newLabel = editProgramDraft.label.trim() || newCode;
    const newColor = editProgramDraft.color;

    if (!newCode) {
      triggerToast('La sigla del programa no puede estar vacía.', 'error');
      return;
    }

    // Si cambia la sigla, se valida que no choque con otro programa existente.
    const duplicate = programTypes.some(p => p.code !== originalCode && p.code.toUpperCase() === newCode);
    if (duplicate) {
      triggerToast('Ya existe otro programa registrado con esa sigla.', 'error');
      return;
    }

    setProgramTypes(prev => prev.map(p => (
      p.code === originalCode ? { code: newCode, label: newLabel, color: newColor } : p
    )));

    // Si la sigla cambió, se actualiza en cascada en todas las actividades que la usan,
    // evitando duplicados si por alguna razón la actividad ya tenía ambos códigos.
    if (newCode !== originalCode) {
      setActivities(prev => prev.map(act => {
        if (!act.programas.includes(originalCode)) return act;
        const updated = act.programas.map(p => (p === originalCode ? newCode : p));
        const deduped = Array.from(new Set(updated));
        return { ...act, programas: deduped };
      }));
      if (filterPrograma === originalCode) setFilterPrograma(newCode);
    }

    handleCancelEditProgramType();
    triggerToast('Programa actualizado correctamente.', 'success');
  };

  const handleDeleteProgramType = (code) => {
    const usedActivities = activities.filter(a => a.programas.includes(code));
    const soloActivities = usedActivities.filter(a => a.programas.length === 1);
    const otherPrograms = programTypes.filter(p => p.code !== code);

    const removeProgramType = () => {
      setProgramTypes(prev => prev.filter(p => p.code !== code));
      if (filterPrograma === code) setFilterPrograma('Todos');
      if (editingProgramCode === code) handleCancelEditProgramType();
    };

    // Caso 1: el programa no está en uso, se elimina directamente.
    if (usedActivities.length === 0) {
      setCustomConfirm({
        show: true,
        title: 'Eliminar Programa',
        message: `¿Desea eliminar el programa "${code}" del sistema? Actualmente no está asociado a ninguna actividad.`,
        onConfirm: () => {
          removeProgramType();
          triggerToast('Programa eliminado correctamente.', 'success');
          closeConfirm();
        },
        onCancel: () => closeConfirm()
      });
      return;
    }

    // Caso 2: hay actividades que dependen EXCLUSIVAMENTE de este programa,
    // pero no existe ningún otro programa al cual reasignarlas. Se bloquea.
    if (soloActivities.length > 0 && otherPrograms.length === 0) {
      triggerToast(
        `No es posible eliminar "${code}": ${soloActivities.length} actividad(es) dependen exclusivamente de este programa y no existe otro programa para reasignarlas.`,
        'error'
      );
      return;
    }

    // Caso 3: hay actividades que quedarían sin ningún programa asociado.
    // Se solicita reasignación, igual que con la eliminación de integrantes.
    if (soloActivities.length > 0) {
      setCustomConfirm({
        show: true,
        title: 'Eliminar Programa con Reasignación',
        message: `El programa "${code}" está asociado a ${usedActivities.length} actividad(es). De estas, ${soloActivities.length} dependen exclusivamente de él. Seleccione a qué programa desea reasignarlas para no dejarlas sin clasificación:`,
        options: otherPrograms.map(p => ({ label: `Reasignar a ${p.code}`, value: p.code })),
        onConfirm: (selectedReassignment) => {
          const target = selectedReassignment || otherPrograms[0].code;

          setActivities(prev => prev.map(act => {
            if (!act.programas.includes(code)) return act;
            if (act.programas.length === 1) {
              return { ...act, programas: [target] };
            }
            return { ...act, programas: act.programas.filter(p => p !== code) };
          }));

          removeProgramType();
          triggerToast(`Programa eliminado. Actividades exclusivas reasignadas a ${target}.`, 'success');
          closeConfirm();
        },
        onCancel: () => closeConfirm()
      });
      return;
    }

    // Caso 4: todas las actividades que usan este programa también tienen otros
    // programas asociados, así que basta con retirarlo de la lista de cada una.
    setCustomConfirm({
      show: true,
      title: 'Eliminar Programa',
      message: `El programa "${code}" se removerá de ${usedActivities.length} actividad(es) que lo tienen junto con otros programas asociados. ¿Desea continuar?`,
      onConfirm: () => {
        setActivities(prev => prev.map(act => (
          act.programas.includes(code)
            ? { ...act, programas: act.programas.filter(p => p !== code) }
            : act
        )));
        removeProgramType();
        triggerToast('Programa eliminado correctamente.', 'success');
        closeConfirm();
      },
      onCancel: () => closeConfirm()
    });
  };

  const handleAddActivity = (e) => {
    e.preventDefault();
    if (!newActName.trim() || newActProgs.length === 0) {
      triggerToast('Por favor, asigne un nombre y al menos un programa.', 'error');
      return;
    }

    const emptyCronograma = {};
    MONTHS.forEach(m => {
      emptyCronograma[m] = { p: false, e: false };
    });

    const newActivity = {
      id: Date.now().toString(),
      fase: newActFase,
      actividad: newActName,
      responsable: newActResp || responsibles[0] || 'Sin Asignar',
      recurso: newActRec,
      programas: newActProgs,
      cronograma: emptyCronograma
    };

    setActivities(prev => [...prev, newActivity]);
    setNewActName('');
    setNewActProgs(programTypes.length > 0 ? [programTypes[0].code] : []);
    setIsAddModalOpen(false);
    triggerToast('Actividad agregada al cronograma correctamente.', 'success');
  };

  const handleOpenEditModal = (activity) => {
    setEditActId(activity.id);
    setEditActName(activity.actividad);
    setEditActResp(activity.responsable);
    setEditActFase(activity.fase);
    setEditActProgs(activity.programas || []);
    setEditActRec(activity.recurso);
    setIsEditModalOpen(true);
  };

  const handleSaveEditActivity = (e) => {
    e.preventDefault();
    if (!editActName.trim() || editActProgs.length === 0) {
      triggerToast('Por favor, especifique el nombre y asigne al menos un programa.', 'error');
      return;
    }

    setActivities(prev => prev.map(act => {
      if (act.id === editActId) {
        return {
          ...act,
          actividad: editActName,
          responsable: editActResp,
          fase: editActFase,
          programas: editActProgs,
          recurso: editActRec
        };
      }
      return act;
    }));

    setIsEditModalOpen(false);
    triggerToast('Actividad actualizada correctamente.', 'success');
  };

  const handleDeleteActivity = (id, name) => {
    setCustomConfirm({
      show: true,
      title: 'Eliminar Actividad',
      message: `¿Está seguro de que desea eliminar permanentemente la actividad: "${name}"?`,
      onConfirm: () => {
        setActivities(prev => prev.filter(a => a.id !== id));
        triggerToast('Actividad eliminada correctamente.', 'success');
        closeConfirm();
      },
      onCancel: () => closeConfirm()
    });
  };

  const handleAddPerson = (e) => {
    e.preventDefault();
    const formattedName = newPersonName.trim();
    if (!formattedName) return;

    if (responsibles.some(r => r.toLowerCase() === formattedName.toLowerCase())) {
      triggerToast('Este integrante ya se encuentra registrado.', 'error');
      return;
    }

    setResponsibles(prev => [...prev, formattedName]);
    setNewPersonName('');
    triggerToast(`¡${formattedName} ha sido agregado al equipo con éxito!`, 'success');
  };

  const handleDeletePerson = (personName) => {
    // Check if the person has activities assigned
    const assignedActivities = activities.filter(a => a.responsable === personName);

    if (assignedActivities.length === 0) {
      setCustomConfirm({
        show: true,
        title: 'Eliminar Integrante',
        message: `¿Desea eliminar a "${personName}" de la lista de responsables? No tiene actividades asignadas actualmente.`,
        onConfirm: () => {
          setResponsibles(prev => prev.filter(r => r !== personName));
          if (filterResponsable === personName) setFilterResponsable('Todos');
          triggerToast('Integrante removido.', 'success');
          closeConfirm();
        },
        onCancel: () => closeConfirm()
      });
    } else {
      // Reassign option parameters for custom modal
      const otherResponsibles = responsibles.filter(r => r !== personName);
      const fallbackOption = otherResponsibles.length > 0 ? otherResponsibles[0] : 'Grupo SGI';

      setCustomConfirm({
        show: true,
        title: 'Eliminar con Reasignación',
        message: `"${personName}" tiene actualmente ${assignedActivities.length} actividades asignadas. Para no dañar el cronograma, seleccione a quién desea reasignar estas tareas:`,
        options: otherResponsibles.map(r => ({ label: `Reasignar a ${r}`, value: r })),
        fallbackOption: otherResponsibles.includes('Grupo SGI')
          ? null
          : { label: 'Reasignar al equipo general (Grupo SGI)', value: 'Grupo SGI' },
        onConfirm: (selectedReassignment) => {
          const reassignTarget = selectedReassignment || fallbackOption;
          
          // Reassign activities
          setActivities(prev => prev.map(act => {
            if (act.responsable === personName) {
              return { ...act, responsable: reassignTarget };
            }
            return act;
          }));

          // Remove person from team
          setResponsibles(prev => prev.filter(r => r !== personName));
          if (filterResponsable === personName) setFilterResponsable('Todos');
          
          triggerToast(`Tareas reasignadas a ${reassignTarget}. Integrante eliminado.`, 'success');
          closeConfirm();
        },
        onCancel: () => closeConfirm()
      });
    }
  };

  const handleExportBackup = () => {
    const dataState = {
      version: "2026.1",
      activities,
      responsibles,
      programTypes
    };
    const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(dataState, null, 2))}`;
    const link = document.createElement("a");
    link.setAttribute("href", jsonString);
    link.setAttribute("download", "cronograma_SGA_backup.json");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    triggerToast('Copia de seguridad del sistema descargada correctamente.', 'success');
  };

  const handleDownloadCSV = () => {
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Fase,Actividad,Responsables,Programas,Recurso,Enero,Febrero,Marzo,Abril,Mayo,Junio,Julio,Agosto,Septiembre,Octubre,Noviembre,Diciembre\n";
    
    activities.forEach(act => {
      const monthDetails = MONTHS.map(m => {
        const p = act.cronograma[m].p ? 'P' : '';
        const e = act.cronograma[m].e ? 'E' : '';
        return p && e ? 'P+E' : p || e || '-';
      }).join(',');

      csvContent += `"${act.fase}","${act.actividad}","${act.responsable}","${act.programas.join('; ')}","${act.recurso}",${monthDetails}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "1. Cronograma de trabajo del SGA 2026_export.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    triggerToast('Reporte de cronograma CSV exportado.', 'success');
  };

  const triggerImportClick = () => {
    if (fileInputRef.current) {
      fileInputRef.current.click();
    }
  };

  const handleImportFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const fileReader = new FileReader();
    fileReader.onload = (event) => {
      try {
        const fileContent = event.target.result;
        // Attempt to parse as JSON first (loss-less copy backup)
        if (file.name.endsWith('.json')) {
          const parsedData = JSON.parse(fileContent);
          if (parsedData.activities && Array.isArray(parsedData.activities)) {
            setActivities(parsedData.activities);
            if (parsedData.responsibles && Array.isArray(parsedData.responsibles)) {
              setResponsibles(parsedData.responsibles);
            }
            if (parsedData.programTypes && Array.isArray(parsedData.programTypes)) {
              setProgramTypes(parsedData.programTypes.map((p, idx) => ({
                color: PROGRAM_COLOR_PALETTE[idx % PROGRAM_COLOR_PALETTE.length].id,
                ...p
              })));
            }
            triggerToast('Cronograma e integrantes restaurados con éxito.', 'success');
          } else {
            triggerToast('Formato JSON inválido. Verifique la estructura.', 'error');
          }
        } 
        // Simple CSV parser for quick uploads
        else if (file.name.endsWith('.csv')) {
          const lines = fileContent.split('\n');
          if (lines.length > 1) {
            const importedActivities = [];
            const detectedResponsibles = new Set(responsibles);
            const detectedPrograms = new Map(programTypes.map(p => [p.code, p]));

            for (let i = 1; i < lines.length; i++) {
              if (!lines[i].trim()) continue;
              // Simple comma split handling basic quotes
              const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
              if (cols.length >= 5) {
                const fase = cols[0].replace(/"/g, '').trim();
                const actividad = cols[1].replace(/"/g, '').trim();
                const responsable = cols[2].replace(/"/g, '').trim();
                const progString = cols[3].replace(/"/g, '').trim();
                const recurso = cols[4].replace(/"/g, '').trim();

                const programas = progString.split(';').map(p => p.trim()).filter(Boolean);
                detectedResponsibles.add(responsable);
                programas.forEach(p => {
                  if (!detectedPrograms.has(p)) {
                    const usedColors = new Set(Array.from(detectedPrograms.values()).map(dp => dp.color));
                    const autoColor = PROGRAM_COLOR_PALETTE.find(c => !usedColors.has(c.id))?.id
                      || PROGRAM_COLOR_PALETTE[detectedPrograms.size % PROGRAM_COLOR_PALETTE.length].id;
                    detectedPrograms.set(p, { code: p, label: p, color: autoColor });
                  }
                });

                // Reconstruct cronograma
                const cronograma = {};
                MONTHS.forEach((m, idx) => {
                  const val = cols[5 + idx] ? cols[5 + idx].replace(/"/g, '').trim() : '-';
                  cronograma[m] = {
                    p: val.includes('P'),
                    e: val.includes('E')
                  };
                });

                importedActivities.push({
                  id: `imported-${Date.now()}-${i}`,
                  fase: ['PLANEAR', 'HACER', 'VERIFICAR', 'ACTUAR'].includes(fase) ? fase : 'PLANEAR',
                  actividad,
                  responsable,
                  recurso,
                  programas: programas.length > 0 ? programas : (programTypes[0] ? [programTypes[0].code] : []),
                  cronograma
                });
              }
            }

            if (importedActivities.length > 0) {
              setActivities(importedActivities);
              setResponsibles(Array.from(detectedResponsibles));
              setProgramTypes(Array.from(detectedPrograms.values()));
              triggerToast(`¡Importados ${importedActivities.length} registros del CSV correctamente!`, 'success');
            } else {
              triggerToast('No se pudieron procesar datos del CSV.', 'error');
            }
          }
        }
      } catch (err) {
        triggerToast('Error al leer o analizar el archivo.', 'error');
      }
    };
    fileReader.readAsText(file);
    // Reset file value to allow importing same file again
    e.target.value = '';
  };

  const filteredActivities = useMemo(() => {
    return activities.filter(act => {
      const matchesResp = filterResponsable === 'Todos' || act.responsable === filterResponsable;
      const matchesProg = filterPrograma === 'Todos' || act.programas.includes(filterPrograma);
      const matchesFase = filterFase === 'Todos' || act.fase === filterFase;
      const matchesSearch = act.actividad.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            act.programas.some(p => p.toLowerCase().includes(searchTerm.toLowerCase()));
      return matchesResp && matchesProg && matchesFase && matchesSearch;
    });
  }, [activities, filterResponsable, filterPrograma, filterFase, searchTerm]);

  // PAGINACIÓN DE LA MATRIZ DE ACTIVIDADES
  // Evita renderizar cientos de filas (con sus 12 meses x 2 celdas cada una) de una sola
  // vez, lo que mantiene la tabla fluida cuando el cronograma crece con el tiempo.
  const [currentPage, setCurrentPage] = useState(1);
  const [pageSize, setPageSize] = useState(10);

  const totalPages = Math.max(1, Math.ceil(filteredActivities.length / pageSize));

  // Si los filtros cambian y la página actual queda fuera de rango, se ajusta automáticamente.
  useEffect(() => {
    setCurrentPage(prev => Math.min(prev, totalPages));
  }, [totalPages]);

  // Volver a la primera página cada vez que cambian los filtros o la búsqueda,
  // para no quedar "perdido" en una página vacía de otro contexto de filtro.
  useEffect(() => {
    setCurrentPage(1);
  }, [filterResponsable, filterPrograma, filterFase, searchTerm, pageSize]);

  const paginatedActivities = useMemo(() => {
    const start = (currentPage - 1) * pageSize;
    return filteredActivities.slice(start, start + pageSize);
  }, [filteredActivities, currentPage, pageSize]);

  const metrics = useMemo(() => {
    let totalPlanned = 0;
    let totalExecuted = 0;
    let pendingThisMonth = 0;

    activities.forEach(act => {
      MONTHS.forEach(m => {
        if (act.cronograma[m].p) {
          totalPlanned++;
          if (act.cronograma[m].e) {
            totalExecuted++;
          } else {
            pendingThisMonth++;
          }
        }
      });
    });

    const completionRate = totalPlanned > 0 ? (totalExecuted / totalPlanned) * 100 : 0;

    const phaseMetrics = {
      PLANEAR: { planned: 0, executed: 0 },
      HACER: { planned: 0, executed: 0 },
      VERIFICAR: { planned: 0, executed: 0 },
      ACTUAR: { planned: 0, executed: 0 }
    };

    activities.forEach(act => {
      if (phaseMetrics[act.fase]) {
        MONTHS.forEach(m => {
          if (act.cronograma[m].p) {
            phaseMetrics[act.fase].planned++;
            if (act.cronograma[m].e) {
              phaseMetrics[act.fase].executed++;
            }
          }
        });
      }
    });

    const monthlyMetrics = MONTHS.map(m => {
      let planned = 0;
      let executed = 0;
      activities.forEach(act => {
        if (act.cronograma[m].p) {
          planned++;
          if (act.cronograma[m].e) {
            executed++;
          }
        }
      });
      return { month: m, planned, executed };
    });

    const responsableMetrics = {};
    responsibles.forEach(r => {
      responsableMetrics[r] = { planned: 0, executed: 0, count: 0 };
    });

    activities.forEach(act => {
      const resp = act.responsable;
      if (!responsableMetrics[resp]) {
        responsableMetrics[resp] = { planned: 0, executed: 0, count: 0 };
      }
      responsableMetrics[resp].count++;
      MONTHS.forEach(m => {
        if (act.cronograma[m].p) {
          responsableMetrics[resp].planned++;
          if (act.cronograma[m].e) {
            responsableMetrics[resp].executed++;
          }
        }
      });
    });

    return {
      totalPlanned,
      totalExecuted,
      pendingThisMonth,
      completionRate,
      phaseMetrics,
      monthlyMetrics,
      responsableMetrics
    };
  }, [activities, responsibles]);

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased flex flex-col">
      
      {/* HEADER DE LA APLICACIÓN */}
      <header className="bg-emerald-900 text-white shadow-lg border-b border-emerald-800">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="bg-emerald-700 p-2.5 rounded-xl text-emerald-100 shadow-inner">
              <FileSpreadsheet className="h-7 w-7" />
            </div>
            <div>
              <span className="text-xs font-bold uppercase tracking-widest text-emerald-300">SISTEMA GESTIÓN AMBIENTAL 2026</span>
              <h1 className="text-2xl font-black tracking-tight">Control & Cumplimiento SGA</h1>
              <div className="flex items-center gap-1.5 text-[11px] text-emerald-300/80 mt-0.5" title="Los datos se guardan automáticamente en este navegador (localStorage). Use 'Guardar Copia JSON' para respaldarlos fuera del navegador o compartirlos con otro equipo.">
                <Save className="h-3 w-3" />
                {lastSavedAt
                  ? `Guardado automáticamente ${formatRelativeTime(lastSavedAt)} en este navegador`
                  : 'Los cambios se guardarán automáticamente en este navegador'}
              </div>
            </div>
          </div>
          
          <div className="flex flex-wrap items-center gap-2">
            <button 
              onClick={handleDownloadCSV}
              title="Exportar base actual a formato de hoja de cálculo CSV"
              className="flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold bg-emerald-800 hover:bg-emerald-700 text-white border border-emerald-600 rounded-lg transition-all shadow-sm"
            >
              <Download className="h-3.5 w-3.5" />
              Exportar CSV
            </button>
            <button 
              onClick={handleExportBackup}
              title="Guardar estado del sistema en archivo JSON para recuperar después o llevarlo a otro equipo/navegador"
              className="flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold bg-emerald-800 hover:bg-emerald-700 text-white border border-emerald-600 rounded-lg transition-all shadow-sm"
            >
              <FileSpreadsheet className="h-3.5 w-3.5" />
              Guardar Copia JSON
            </button>
            <button 
              onClick={triggerImportClick}
              title="Restaurar el cronograma cargando un archivo JSON de respaldo o planilla CSV"
              className="flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border border-emerald-200 rounded-lg transition-all shadow-sm"
            >
              <Upload className="h-3.5 w-3.5" />
              Importar
            </button>
            <input 
              type="file" 
              ref={fileInputRef}
              onChange={handleImportFile}
              accept=".json,.csv"
              className="hidden"
            />
            <button
              onClick={handleResetLocalData}
              title="Borrar los datos guardados en este navegador y restaurar los valores de fábrica"
              className="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold bg-emerald-950/60 hover:bg-red-900/60 text-emerald-200 hover:text-white border border-emerald-700 rounded-lg transition-all shadow-sm"
            >
              <HardDriveDownload className="h-3.5 w-3.5" />
            </button>
            <button 
              onClick={() => setIsAddModalOpen(true)}
              disabled={programTypes.length === 0}
              title={programTypes.length === 0 ? 'Registre al menos un programa antes de crear actividades' : undefined}
              className={`flex items-center gap-1 px-4 py-2 text-xs font-bold rounded-lg transition-all shadow-md ml-2 ${
                programTypes.length === 0
                  ? 'bg-emerald-950/40 text-emerald-400 cursor-not-allowed'
                  : 'bg-white hover:bg-emerald-50 text-emerald-900'
              }`}
            >
              <Plus className="h-4 w-4" />
              Nueva Actividad
            </button>
          </div>
        </div>
      </header>

      {/* MENÚ DE NAVEGACIÓN PRINCIPAL */}
      <div className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-xs">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex space-x-8">
            <button
              onClick={() => setActiveTab('dashboard')}

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Responsable</label>
                  <select
                    value={newActResp}
                    onChange={(e) => setNewActResp(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  >
                    {responsibles.map(r => (
                      <option key={r} value={r}>{r}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Fase del Ciclo PHVA</label>
                  <select
                    value={newActFase}
                    onChange={(e) => setNewActFase(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  >
                    <option value="PLANEAR">PLANEAR</option>
                    <option value="HACER">HACER</option>
                    <option value="VERIFICAR">VERIFICAR</option>
                    <option value="ACTUAR">ACTUAR</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tipo de Recurso</label>
                  <select
                    value={newActRec}
                    onChange={(e) => setNewActRec(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none"
                  >
                    <option value="Administrativo">Administrativo</option>
                    <option value="Presupuestal">Presupuestal</option>
                    <option value="Tecnológico">Tecnológico</option>
                  </select>
                </div>
              </div>

              <div className="flex gap-3 justify-end pt-4">
                <button
                  type="button"
                  onClick={() => setIsAddModalOpen(false)}
                  className="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={newActProgs.length === 0}
                  className={`px-5 py-2 text-xs font-bold text-white rounded-xl transition-all shadow-md ${
                    newActProgs.length === 0 ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-800 hover:bg-emerald-700'
                  }`}
                >
                  Guardar Actividad
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL PARA EDITAR ACTIVIDAD (NUEVO REQUERIMIENTO) */}
      {isEditModalOpen && (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
            <div className="flex justify-between items-center mb-5">
              <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                <Edit2 className="h-5 w-5 text-emerald-600" />
                Editar Actividad
              </h3>
              <button 
                onClick={() => setIsEditModalOpen(false)}
                className="text-slate-400 hover:text-slate-600 p-1 rounded-lg"
              >
                <X className="h-5 w-5" />
              </button>
            </div>

            <form onSubmit={handleSaveEditActivity} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Descripción de la Actividad</label>
                <textarea
                  required
                  rows={3}
                  value={editActName}
                  onChange={(e) => setEditActName(e.target.value)}
                  className="w-full p-3 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:outline-none transition-all"
                />
              </div>

              {/* SECCIÓN SELECCIÓN MULTI-PROGRAMA EDITAR */}
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-150">
                <div className="flex items-center justify-between mb-2">
                  <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                    Programas Asociados (Selección Múltiple)
                  </label>
                  <button 
                    type="button" 
                    onClick={() => handleSelectAllPrograms('edit')}
                    className="text-[10px] text-emerald-700 hover:text-emerald-800 font-bold hover:underline"
                  >
                    Seleccionar Todos
                  </button>
                </div>
                
                <div className="flex flex-wrap gap-2">
                  {programTypes.map(({ code: prog, label, color }) => {
                    const isSelected = editActProgs.includes(prog);
                    const colorClasses = getColorClasses(color);
                    
                    return (
                      <button
                        type="button"
                        key={prog}
                        onClick={() => handleToggleProgramSelection(prog, 'edit')}
                        className={`px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border relative ${
                          isSelected 
                            ? `${colorClasses.solid} shadow-sm` 
                            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        <div className={`w-3 h-3 rounded-full flex items-center justify-center border ${
                          isSelected ? 'bg-white/30 border-white/50' : 'bg-slate-100 border-slate-300'
                        }`}>
                          {isSelected && <Check className="h-2.5 w-2.5 text-white font-extrabold" />}
                        </div>
                        {label}
                      </button>
                    );
                  })}
                  {/* Códigos heredados que ya no están registrados como tipo de programa,
                      pero que la actividad aún conserva (se permite deseleccionarlos). */}
                  {editActProgs.filter(p => !programTypes.some(pt => pt.code === p)).map(prog => (
                    <button
                      type="button"
                      key={prog}
                      onClick={() => handleToggleProgramSelection(prog, 'edit')}
                      title="Este programa ya no está registrado en el sistema"
                      className="px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border border-dashed border-amber-300 bg-amber-50 text-amber-700"
                    >
                      <AlertCircle className="h-3 w-3" />
                      {prog} (no registrado)
                    </button>
                  ))}
                </div>
                {editActProgs.length === 0 && (
                  <p className="text-red-500 text-[10px] mt-2 font-semibold">⚠️ Debe seleccionar al menos un programa para poder actualizar.</p>
                )}
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Responsable</label>
                  <select
                    value={editActResp}
                    onChange={(e) => setEditActResp(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  >
                    {responsibles.map(r => (
                      <option key={r} value={r}>{r}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Fase del Ciclo PHVA</label>
                  <select
                    value={editActFase}
                    onChange={(e) => setEditActFase(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                  >
                    <option value="PLANEAR">PLANEAR</option>
                    <option value="HACER">HACER</option>
                    <option value="VERIFICAR">VERIFICAR</option>
                    <option value="ACTUAR">ACTUAR</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tipo de Recurso</label>
                  <select
                    value={editActRec}
                    onChange={(e) => setEditActRec(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white focus:outline-none"
                  >
                    <option value="Administrativo">Administrativo</option>
                    <option value="Presupuestal">Presupuestal</option>
                    <option value="Tecnológico">Tecnológico</option>
                  </select>
                </div>
              </div>

              <div className="flex gap-3 justify-end pt-4">
                <button
                  type="button"
                  onClick={() => setIsEditModalOpen(false)}
                  className="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={editActProgs.length === 0}
                  className={`px-5 py-2 text-xs font-bold text-white rounded-xl transition-all shadow-md ${
                    editActProgs.length === 0 ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-800 hover:bg-emerald-700'
                  }`}
                >
                  Actualizar Actividad
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* TOAST SYSTEM (PREVENT BROWSER ALERTS) */}
      {toast.show && (
        <div className="fixed bottom-5 right-5 z-50 animate-bounce">
          <div className={`p-4 rounded-xl shadow-lg border text-xs font-bold flex items-center gap-2.5 ${
            toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'
          }`}>
            <CheckCircle className="h-4 w-4 text-emerald-600 shrink-0" />
            <span>{toast.message}</span>
          </div>
        </div>
      )}

      {/* CUSTOM CONFIRMATION MODAL SYSTEM (PREVENT BROWSER CONFIRMS) */}
      {customConfirm.show && (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
            <div className="flex items-center gap-2 text-amber-600 mb-3">
              <AlertCircle className="h-5 w-5" />
              <h4 className="font-black text-slate-900 text-sm uppercase tracking-wide">{customConfirm.title}</h4>
            </div>
            
            <p className="text-slate-600 text-xs leading-relaxed mb-5">{customConfirm.message}</p>

            {/* If there are specific reassign options (when removing a person or program with active tasks) */}
            {customConfirm.options ? (
              <div className="space-y-2 mb-6">
                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Seleccione el Reasignado:</label>
                <div className="grid grid-cols-1 gap-1.5">
                  {customConfirm.options.map(opt => (
                    <button
                      key={opt.value}
                      onClick={() => customConfirm.onConfirm(opt.value)}
                      className="text-left px-3.5 py-2.5 text-xs font-semibold bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 rounded-xl transition-all text-slate-700 hover:text-emerald-900"
                    >
                      {opt.label}
                    </button>
                  ))}
                  {customConfirm.fallbackOption && (
                    <button
                      onClick={() => customConfirm.onConfirm(customConfirm.fallbackOption.value)}
                      className="text-left px-3.5 py-2.5 text-xs font-semibold bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 rounded-xl transition-all text-slate-700 hover:text-emerald-900"
                    >
                      {customConfirm.fallbackOption.label}
                    </button>
                  )}
                </div>
              </div>
            ) : null}

            <div className="flex justify-end gap-2.5">
              <button
                onClick={customConfirm.onCancel}
                className="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all"
              >
                Cancelar
              </button>
              {!customConfirm.options && (
                <button
                  onClick={customConfirm.onConfirm}
                  className="px-5 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition-all shadow-md"
                >
                  Confirmar Acción
                </button>
              )}
            </div>
          </div>
        </div>
      )}

    </div>
  );
}
const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
